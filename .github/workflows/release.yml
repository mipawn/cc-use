name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm vite build && pnpm electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.zip.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm vite build && pnpm electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.zip
            release/latest*.yml
            release/*.exe.blockmap
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: false
          files: artifacts/*
          body: |
            For stable releases, please refer to CHANGELOG.md for details.
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md

            ---

            ## macOS 用户注意
            由于本应用未进行 Apple 签名，macOS 可能会提示"文件已损坏"或"无法验证开发者"。
            请在终端中执行以下命令后重新打开应用：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/CC\ Use.app
            ```
            如果你的应用不在 `/Applications` 目录，请将路径替换为实际安装路径。
