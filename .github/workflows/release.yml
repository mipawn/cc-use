name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          # macOS ARM runner (Apple Silicon)
          - platform: macos-14
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          # macOS Intel runner (x86_64)
          - platform: macos-13
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            For stable releases, please refer to CHANGELOG.md for details.
            https://github.com/${{ github.repository }}/blob/v__VERSION__/CHANGELOG.md

            ---

            ## macOS 用户注意
            由于本应用未进行 Apple 签名，macOS 可能会提示"文件已损坏"或"无法验证开发者"。
            请在终端中执行以下命令后重新打开应用：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/CC\ Use.app
            ```
            如果你的应用不在 `/Applications` 目录，请将路径替换为实际安装路径。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][setup][ext]"
          args: ${{ matrix.args }}
